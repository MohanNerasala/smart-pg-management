# StayNest Backend Configuration (Local MySQL)
spring.application.name=staynest-backend

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pg_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=chakri
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security / OAuth2 (Mock)
spring.security.oauth2.client.registration.google.client-id=MOCK_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=MOCK_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000
jwt.jwtRefreshExpirationMs=2592000000

# App CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Server Configuration
server.port=8081
