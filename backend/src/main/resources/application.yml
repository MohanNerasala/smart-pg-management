spring:
  application:
    name: staynest-backend
  main:
    # DEFINITIVE FIX: Force the app to run as a web server and stay alive
    web-application-type: servlet
    lazy-initialization: true
  datasource:
    # IPv4 COMPATIBILITY FIX: Use the Supavisor Pooler (Session Mode) for Render.com
    # Render requires IPv4, but the direct Supabase URL is IPv6 only.
    url: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
    username: postgres.dablrwdnybxqofefxtim
    password: irkahchakri0987
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # STABLE STARTUP: Allow 5 seconds for initial connection
      initialization-fail-timeout: 5000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hibernate.temp.use_jdbc_metadata_defaults: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:MOCK_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:MOCK_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

