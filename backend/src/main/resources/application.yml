spring:
  application:
    name: staynest-backend
  datasource:
  
  jpa:  url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pg_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:MOCK_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:MOCK_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: 86400000 
  jwtRefreshExpirationMs: 2592000000 

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: 8080
